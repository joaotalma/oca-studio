<!doctype html>
<html><head><meta charset="utf-8"><title>Se Vira, Tico: estudo visual 2D (depois)</title>
<style>html,body{margin:0;background:#111}canvas{display:block;height:100vh;width:auto;margin:auto}</style>
<script src="chars.js"></script>
<script src="cenarios.js"></script>
<script src="acabamento.js"></script>
<script src="organico.js"></script>
<script src="cenario-rico.js"></script>
<script src="estudo.js"></script>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
const g = document.getElementById('c').getContext('2d');
window.FILM_DURATION = Estudo.DURACAO;
window.svgDoQuadro = (t) => Estudo.quadro(t, 'depois');
window.renderFrame = async (t) => {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(Estudo.quadro(t, 'depois'));
  await img.decode();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.clearRect(0, 0, 1080, 1920);
  g.drawImage(img, 0, 0, 1080, 1920);
};
window.renderFrame(0).then(() => { window.READY = true; });
})();
</script></body></html>
