<!doctype html>
<html><head><meta charset="utf-8"><title>Se Vira, Tico: capa do episódio 5</title>
<style>html,body{margin:0;background:#111}svg{display:block}</style>
<script src="chars.js"></script>
<script src="cenarios.js"></script>
</head><body>
<script>
// Capa 1080x1920. A grade do perfil corta em 3:4 (y de 240 a 1680): título, Lua, caixas e selo ficam nessa faixa.
const contorno = (x, y, s, tam, cor, borda = 16) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="${FONTE}" font-size="${tam}" font-weight="900" fill="${cor}" stroke="${OUT}" stroke-width="${borda}" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
let s = '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">';
// A cozinha da Lua à noite, com a luminária acesa
s += `<g transform="translate(540 960) scale(1.25) translate(-540 -1000)">` + CENARIOS.cozinhaLuaNoite().map((c) => c.svg).join('');
s += `<g transform="translate(470 ${CHAO}) scale(1.32)">${drawChar(CHARS.lua, { expr: 'preocupado', armR: [22, 178], propR: 'phone', look: [0, 0], blink: 0, breath: 0 })}</g>`;
s += bancadaLua(false) + [0, 1, 2, 3, 4, 5].map((i) => caixaDoceSVG(300 + (i % 3) * 120 + (i > 2 ? 60 : 0), 1215 - (i > 2 ? 78 : 0), .85, ['#f3d1d9', '#fbe7b5', '#cfe8e2'][i % 3])).join('') + '</g>';
// Faixa escura atrás do título
s += `<defs><linearGradient id="topo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172540" stop-opacity=".92"/><stop offset=".75" stop-color="#172540" stop-opacity=".7"/><stop offset="1" stop-color="#172540" stop-opacity="0"/></linearGradient></defs>`;
s += `<rect x="0" y="0" width="1080" height="760" fill="url(#topo)"/>`;
s += `<g transform="rotate(-3 540 420)">` + contorno(540, 365, 'SE VIRA,', 130, '#fff6e6', 18) + contorno(540, 565, 'TICO', 230, '#f2d36b', 22) + '</g>';
// O relógio da entrega
s += `<g transform="rotate(4 860 760)">` + ret(640, 700, 400, 120, '#2a1f22', 22, 6) + txt(840, 780, '19h41', 70, '#ffd83a') + '</g>';
// Selo do episódio
s += `<g transform="rotate(-2 540 1570)">` + ret(150, 1490, 780, 180, '#fff6e6', 26, 6) + ret(120, 1452, 170, 80, '#c23b3b', 18, 6) + txt(205, 1509, 'EP. 5', 44, '#fff6e6')
  + txt(540, 1574, 'DÁ TEMPO?', 64, OUT) + txt(540, 1640, 'ELE ESTÁ A 34 MINUTOS', 46, '#c23b3b') + '</g>';
s += '</svg>';
document.body.innerHTML = s;
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body></html>
