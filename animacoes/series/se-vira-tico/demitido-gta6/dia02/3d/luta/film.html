<script type="module">

import * as THREE from 'three';
const W = 1080, H = 1920, DUR = 15.9;
window.FILM_DURATION = DUR;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const COR = { lilas: 0x8a6fd6, lilasD: 0x5a43a0, pessego: 0xffa98f, rosa: 0xff8fb3, suit: 0xffcf5a, calca: 0x414d64, luva: 0xffffff, contorno: 0x2a1c45,
  paoA: 0xe9a24a, paoB: 0xd98a35, carne: 0x6b3a22, queijo: 0xffd23f, alface: 0x6fcf6a, tomate: 0xe8453c, ternoH: 0xd9453c, calcaH: 0xfff0b8 };
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra });
const outlineMat = (t, radial = false) => new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { t: { value: t }, c: { value: new THREE.Color(COR.contorno) } },
  vertexShader: radial ? 'uniform float t; void main(){ vec3 d = normalize(vec3(position.xy,0.0)+vec3(0.0,0.0,0.0001)); gl_Position = projectionMatrix*modelViewMatrix*vec4(position + d*t,1.0); }' : 'uniform float t; void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position + normal*t,1.0); }',
  fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c,1.0); }' });
function mesh(geo, color, t = 0.04, extra, radial = false) { const g = new THREE.Group(); g.add(new THREE.Mesh(geo, toon(color, extra))); if (t) g.add(new THREE.Mesh(geo, outlineMat(t, radial))); return g; }
function rrShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
const ext = (shape, d, b = 0.04) => new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });

// ----- interpolação por quadros-chave (suave entre pontos) -----
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function kf(t, pts) { if (t <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * sm(pts[i - 1][0], pts[i][0], t); return pts.at(-1)[1]; }
const pulso = (t, t0, subida, queda) => sm(t0 - subida, t0, t) * (1 - sm(t0, t0 + queda, t));   // sobe até t0 e desce

// ----- cena -----

parede.position.set(0, 4, -4.5); scene.add(parede);
const chaoTex = canvasTex(512, 512, (g, w, h) => { for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { g.fillStyle = (i + j) % 2 ? '#f6e9df' : '#e0d0f0'; g.fillRect(i * w / 8, j * h / 8, w / 8, h / 8); } });
chaoTex.wrapS = chaoTex.wrapT = THREE.RepeatWrapping; chaoTex.repeat.set(3, 3);

function placa(txt, w, cor, x, y) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.62), new THREE.MeshBasicMaterial({ transparent: true, map: canvasTex(Math.round(w * 260), 160, (g, cw, ch) => { g.fillStyle = cor; g.beginPath(); g.roundRect(6, 6, cw - 12, ch - 12, 34); g.fill(); g.strokeStyle = '#ffd98a'; g.lineWidth = 8; g.stroke(); g.fillStyle = '#fff4dc'; g.font = '900 64px Arial Black, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, cw / 2, ch / 2 + 4); }) })); m.position.set(x, y, -4.3); scene.add(m); }

// fundo de shopping: lojas nas laterais (fachada com toldo, vitrine e ícone, sem texto), fonte no centro, plantas e luminárias

    c.fillStyle = 'rgba(90,67,160,.28)'; for (let i = 0; i < 3; i++) { c.beginPath(); c.roundRect(24 + i * 78, h - 100 - (i % 2) * 24, 60, 70 + (i % 2) * 24, 12); c.fill(); } }) })); vitrine.position.set(0, 1.55, 0.27); g.add(vitrine);
  const moldura = mesh(new THREE.BoxGeometry(1.86, 2.06, 0.08), 0x2a1c45, 0.02); moldura.position.set(0, 1.55, 0.22); g.add(moldura);
  const toldo = mesh(new THREE.BoxGeometry(2.7, 0.5, 0.9), corToldo, 0.03); toldo.position.set(0, 3.0, 0.45); toldo.rotation.x = 0.35; g.add(toldo);
  for (let i = 0; i < 5; i++) { const lis = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.5), new THREE.MeshBasicMaterial({ color: 0xfff1d6 })); lis.position.set(-1.0 + i * 0.5, 3.0, 0.9); lis.rotation.x = 0.35; lis.scale.set(1, 0.9, 1); g.add(lis); }
  const placaIcone = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.8), new THREE.MeshBasicMaterial({ transparent: true, map: canvasTex(400, 160, (c, w, h) => { c.fillStyle = '#2a1c45'; c.beginPath(); c.roundRect(4, 4, w - 8, h - 8, 28); c.fill(); icone(c, w, h); }) })); placaIcone.position.set(0, 3.95, 0.27); g.add(placaIcone);
  const porta = mesh(new THREE.BoxGeometry(0.62, 1.2, 0.06), 0x2a1c45, 0.02); porta.position.set(1.0, 0.6, 0.3); g.add(porta);
  scene.add(g); return g; }
const iconeCelular = (c, w, h) => { c.fillStyle = '#c9b8ff'; c.beginPath(); c.roundRect(w / 2 - 38, 22, 76, 116, 14); c.fill(); c.fillStyle = '#ff9cc2'; c.beginPath(); c.roundRect(w / 2 - 30, 34, 60, 84, 8); c.fill(); c.strokeStyle = '#3a1f4a'; c.lineWidth = 6; c.beginPath(); c.arc(w / 2 - 12, 66, 6, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); c.beginPath(); c.arc(w / 2 + 12, 66, 6, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); c.beginPath(); c.arc(w / 2, 82, 12, 0.2, Math.PI - 0.2); c.stroke(); };

// fonte (bacia, dois níveis, jatos que sobem e caem) no centro do corredor
const fonte = new THREE.Group(); fonte.position.set(0, 0, -3.2); scene.add(fonte);
const bacia = mesh(new THREE.CylinderGeometry(1.55, 1.7, 0.55, 36), 0xc9b8ff, 0.03); bacia.position.y = 0.28; fonte.add(bacia);
const aguaTex = canvasTex(256, 256, (c, w, h) => { const gr = c.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2); gr.addColorStop(0, '#d6f2ff'); gr.addColorStop(1, '#7fcfff'); c.fillStyle = gr; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 5; for (const r of [40, 80, 115]) { c.beginPath(); c.arc(w / 2, h / 2, r, 0, 7); c.stroke(); } });
const agua = new THREE.Mesh(new THREE.CircleGeometry(1.42, 36), new THREE.MeshBasicMaterial({ map: aguaTex })); agua.rotation.x = -Math.PI / 2; agua.position.y = 0.57; fonte.add(agua);
const pilar = mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.5, 16), 0xb9acd9, 0.03); pilar.position.y = 1.3; fonte.add(pilar);
const taca = mesh(new THREE.CylinderGeometry(0.95, 0.5, 0.3, 28), 0xc9b8ff, 0.03); taca.position.y = 1.55; fonte.add(taca);
const agua2 = new THREE.Mesh(new THREE.CircleGeometry(0.88, 28), new THREE.MeshBasicMaterial({ color: 0x9fdcff })); agua2.rotation.x = -Math.PI / 2; agua2.position.y = 1.71; fonte.add(agua2);

const jatos = []; for (let i = 0; i < 18; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), toon(0xa8e1ff)); d.scale.set(0.8, 1.2, 0.8); fonte.add(d); jatos.push({ d, ang: i / 18 * 6.283, fase: (i * 0.137) % 1, alt: 0.7 + (i % 3) * 0.25, raio: 0.45 + (i % 4) * 0.22 }); }
// plantas em vasos e luminárias de teto
function vaso(x, z) { const g = new THREE.Group(); g.position.set(x, 0, z); const v = mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.7, 14), 0xe8a38a, 0.03); v.position.y = 0.35; g.add(v); for (let i = 0; i < 5; i++) { const f = mesh(new THREE.CapsuleGeometry(0.09, 1.0, 4, 8), 0x4fbf6a, 0.02); f.position.set(Math.sin(i * 1.26) * 0.3, 1.2, Math.cos(i * 1.26) * 0.15); f.rotation.z = Math.sin(i * 1.26) * 0.9; g.add(f); } scene.add(g); }
vaso(-1.75, -3.6); vaso(1.75, -3.6);
for (let i = -2; i <= 2; i++) { const l = new THREE.Mesh(new THREE.CircleGeometry(0.22, 14), new THREE.MeshBasicMaterial({ color: 0xfff6d6 })); l.position.set(i * 1.6, 7.2, -4.4); scene.add(l); }
// segundo andar do shopping (corrimão de vidro) e varal de bandeirinhas no teto
const andar2 = mesh(new THREE.BoxGeometry(14, 0.3, 1.2), 0x8f7fb4, 0.03); andar2.position.set(0, 5.4, -4.2); scene.add(andar2);
const vidro2 = new THREE.Mesh(new THREE.PlaneGeometry(14, 0.9), new THREE.MeshBasicMaterial({ color: 0xc9b8ff, transparent: true, opacity: 0.38 })); vidro2.position.set(0, 5.95, -3.7); scene.add(vidro2);
const trilho = mesh(new THREE.CapsuleGeometry(0.05, 14, 4, 8), 0x2a1c45, 0.02); trilho.rotation.z = Math.PI / 2; trilho.position.set(0, 6.4, -3.7); scene.add(trilho);
for (let i = 0; i < 14; i++) { const x = -3.5 + i * 0.54, y = 7.0 - Math.sin(i / 13 * Math.PI) * 0.5; const bd = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 3), new THREE.MeshBasicMaterial({ color: [0xff8fb3, 0xffd23f, 0x8a6fd6, 0x6fcf6a][i % 4] })); bd.position.set(x, y - 0.25, -3.9); bd.rotation.z = Math.PI; scene.add(bd); }
for (const x of [-3.2, 3.2]) { const pil = mesh(new THREE.BoxGeometry(0.5, 5.4, 0.5), 0xb9acd9, 0.03); pil.position.set(x, 2.7, -3.9); scene.add(pil); }

// ----- peças de personagem -----
const luvaDe = (p, y) => { const l = mesh(new THREE.SphereGeometry(0.3, 18, 14), COR.luva, 0.035); l.position.y = y; p.add(l); };
function bracoDe(lado, corpoGrp, cor) { const p = new THREE.Group(); p.position.set(lado * 0.78, 2.1, 0); const b = mesh(new THREE.CapsuleGeometry(0.2, 0.75, 6, 14), cor, 0.035); b.position.y = -0.5; p.add(b); luvaDe(p, -1.1); corpoGrp.add(p); return p; }
function pernaDe(lado, corpoGrp, corCalca, corSapato) { const p = new THREE.Group(); p.position.set(lado * 0.3, 1.0, 0); const b = mesh(new THREE.CapsuleGeometry(0.22, 0.6, 6, 14), corCalca, 0.035); b.position.y = -0.4; p.add(b); const s = mesh(new THREE.SphereGeometry(0.36, 16, 12), corSapato, 0.035); s.scale.set(1, .6, 1.4); s.position.set(0, -0.95, 0.12); p.add(s); corpoGrp.add(p); return p; }
function sombra() { const s = new THREE.Mesh(new THREE.CircleGeometry(0.95, 24), new THREE.MeshBasicMaterial({ color: 0x2a1c45, transparent: true, opacity: .25 })); s.rotation.x = -Math.PI / 2; s.position.y = 0.01; s.scale.set(1, 0.55, 1); return s; }

function celular() {
  const root = new THREE.Group(), corpo = new THREE.Group(); root.add(corpo);
  const torso = mesh(new THREE.CapsuleGeometry(0.62, 0.8, 8, 20), COR.suit, 0.04); torso.position.y = 1.55; corpo.add(torso);
  const barriga = new THREE.Mesh(new THREE.CircleGeometry(0.42, 28), toon(0xfff2c9)); barriga.position.set(0, 1.5, 0.64); barriga.scale.set(1, 1.15, 1); corpo.add(barriga);
  const gola = mesh(new THREE.TorusGeometry(0.55, 0.12, 12, 28), COR.rosa, 0.03); gola.rotation.x = Math.PI / 2; gola.position.y = 2.32; corpo.add(gola);
  const bE = bracoDe(-1, corpo, COR.suit), bD = bracoDe(1, corpo, COR.suit), pE = pernaDe(-1, corpo, COR.calca, COR.rosa), pD = pernaDe(1, corpo, COR.calca, COR.rosa);
  const cabeca = new THREE.Group(); cabeca.position.set(0, 3.38, 0); corpo.add(cabeca);
  const fora = rrShape(1.62, 2.12, 0.34); fora.holes.push(new THREE.Path(rrShape(1.34, 1.84, 0.26).getPoints(18).reverse()));
  const carcaca = mesh(ext(fora, 0.62, 0.05), COR.lilas, 0.035, undefined, true); carcaca.position.z = -0.32; cabeca.add(carcaca);
  const fundo = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.9), toon(COR.lilasD)); fundo.position.z = -0.12; cabeca.add(fundo);
  for (const [y, h] of [[0.35, 0.34], [-0.08, 0.34]]) { const bt = mesh(new THREE.BoxGeometry(0.07, h, 0.12), COR.pessego, 0.02); bt.position.set(0.85, y, 0); cabeca.add(bt); }
  const ant = mesh(new THREE.CapsuleGeometry(0.035, 0.28, 4, 8), COR.pessego, 0.02); ant.position.set(-0.5, 1.2, 0); cabeca.add(ant);
  // rosto na tela: três versões (feliz, esforço, tonto), trocadas por quadro
  const cara = (modo) => canvasTex(512, 700, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#ffb89a'); gr.addColorStop(.55, '#ff9cc2'); gr.addColorStop(1, '#b79bff'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#3a1f4a'; g.fillStyle = '#3a1f4a'; g.lineCap = 'round'; g.lineWidth = 22;
    if (modo === 'feliz') { g.beginPath(); g.arc(150, 270, 52, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); g.beginPath(); g.arc(362, 270, 52, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); g.beginPath(); g.moveTo(112, 380); g.quadraticCurveTo(256, 560, 400, 380); g.quadraticCurveTo(256, 420, 112, 380); g.fill(); g.fillStyle = '#ffd1d9'; g.beginPath(); g.ellipse(256, 470, 62, 30, 0, 0, 7); g.fill(); }
    else if (modo === 'esforco') { g.beginPath(); g.moveTo(100, 290); g.lineTo(200, 250); g.stroke(); g.beginPath(); g.moveTo(412, 290); g.lineTo(312, 250); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(120, 380, 272, 90, 30); g.fill(); g.lineWidth = 14; g.stroke(); g.fillStyle = '#3a1f4a'; for (let x = 160; x < 392; x += 50) g.fillRect(x, 385, 6, 80); }
    else { g.lineWidth = 16; for (const cx of [150, 362]) { g.beginPath(); for (let a = 0; a < 18; a += 0.2) { const r = 4 + a * 3.2; g.lineTo(cx + Math.cos(a) * r, 270 + Math.sin(a) * r); } g.stroke(); } g.beginPath(); g.moveTo(150, 460); for (let x = 150; x <= 362; x += 20) g.lineTo(x, 450 + (x % 40 ? 16 : -16)); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.5)'; for (const x of [78, 434]) { g.beginPath(); g.ellipse(x, 360, 36, 22, 0, 0, 7); g.fill(); } g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(w * .55, 0); g.lineTo(0, h * .45); g.fill(); });
  const texs = { feliz: cara('feliz'), esforco: cara('esforco'), tonto: cara('tonto') };
  const tela = new THREE.Mesh(new THREE.PlaneGeometry(1.34, 1.84), new THREE.MeshBasicMaterial({ map: texs.feliz })); tela.position.set(0, 0, 0.36); cabeca.add(tela);
  const moldura = mesh(ext(rrShape(1.44, 1.94, 0.3), 0.05, 0.03), COR.lilasD, 0.035, undefined, true); moldura.position.set(0, 0, 0.3); cabeca.add(moldura); moldura.children[0].material.side = THREE.DoubleSide;
  tela.position.z = 0.4;
  const estrelas = []; for (let i = 0; i < 3; i++) { const e = mesh(new THREE.OctahedronGeometry(0.16), 0xffe066, 0.02); e.visible = false; cabeca.add(e); estrelas.push(e); }
  root.add(sombra());
  return { root, corpo, cabeca, bE, bD, pE, pD, tela, texs, estrelas };
}

function hamburguer() {
  const root = new THREE.Group(), corpo = new THREE.Group(); root.add(corpo);
  const torso = mesh(new THREE.CapsuleGeometry(0.62, 0.8, 8, 20), COR.ternoH, 0.04); torso.position.y = 1.55; corpo.add(torso);
  const avental = new THREE.Mesh(new THREE.CircleGeometry(0.44, 28), toon(0xffe58a)); avental.position.set(0, 1.45, 0.64); avental.scale.set(1, 1.2, 1); corpo.add(avental);
  const gola = mesh(new THREE.TorusGeometry(0.55, 0.12, 12, 28), 0xffe58a, 0.03); gola.rotation.x = Math.PI / 2; gola.position.y = 2.32; corpo.add(gola);
  const bE = bracoDe(-1, corpo, COR.ternoH), bD = bracoDe(1, corpo, COR.ternoH), pE = pernaDe(-1, corpo, COR.calcaH, 0x6b3a22), pD = pernaDe(1, corpo, COR.calcaH, 0x6b3a22);
  const cabeca = new THREE.Group(); cabeca.position.set(0, 3.35, 0); corpo.add(cabeca);
